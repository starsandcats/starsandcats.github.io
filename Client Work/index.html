
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client Work | Portfolio</title>

  <style>
    body {
      margin: 0;
      padding: 30px;
      font-family: Arial, sans-serif;
    }

    .clients {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    .client-card {
      display: block;
      color: inherit;
      text-decoration: none;
    }

    .client-card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .client-card:hover img {
      transform: scale(1.04);
    }

    @media (max-width: 650px) {
      .clients {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>
  <a href="../index.html">← Back to Portfolio</a>

  <h1>Client Work</h1>
  <p>Selected projects created for clients.</p>

  <section class="clients">
    <a class="client-card" href="../clients/client-one/index.html">
      <img src="../images/clients/dbs/Stars_x_DBS_.JPG"
           alt="dbs project thumbnail">
      <h2>Client One</h2>
    </a>

    <a class="client-card" href="../clients/fishtank/index.html">
      <img src="../images/clients/fishtank1/thumbnail.jpg"
           alt="Client Two project thumbnail">
      <h2>Client Two</h2>
    </a>
  </section>
</body>
</html>
