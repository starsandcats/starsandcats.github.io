
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DBS | starsandtigers</title>

  <style>
    body {
      margin: 0;
      background: #f7f5f0;
      color: #222;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 25px 6%;
      border-bottom: 1px solid #ddd;
    }

    header a { color: inherit; }

    main { padding: 40px 6%; }

    h1 { font-size: clamp(36px, 6vw, 64px); }

    .description {
      max-width: 650px;
      line-height: 1.7;
      margin-bottom: 45px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .gallery img {
      display: block;
      width: 100%;
      height: auto;
      cursor: zoom-in;
      transition: opacity .2s;
    }

    .gallery img:hover { opacity: .8; }

    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0, 0, 0, .92);
      align-items: center;
      justify-content: center;
      padding: 25px;
      cursor: zoom-out;
    }

    #lightbox.active { display: flex; }

    #zoomedImage {
      max-width: 95vw;
      max-height: 90vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    #closeButton {
      position: absolute;
      top: 15px;
      right: 25px;
      color: white;
      background: none;
      border: none;
      font-size: 42px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      header { padding: 22px 5%; }
      main { padding: 30px 5%; }
      .gallery { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <header>
    <a href="../../client-work/index.html">← All Client Work</a>
  </header>

  <main>
    <h1>DBS</h1>

    <section class="description">
      <p>
        INSERT DESCRIPTION HERE
      </p>
    </section>

    <h2>Selected Work</h2>

    <section class="gallery">
      <img src="../../images/clients/dbs/DBS_lifting_Animation_.GIF"
           alt="DBS_lifting_Animation_.GIF">

      <img src="../../images/clients/client-one/work-2.jpg"
           alt="Second project artwork">
    </section>
  </main>

  <div id="lightbox" onclick="closeImage()"
       role="dialog" aria-modal="true"
       aria-label="Enlarged artwork">

    <button id="closeButton"
            aria-label="Close enlarged artwork"
            onclick="event.stopPropagation(); closeImage()">
      &times;
    </button>

    <img id="zoomedImage" alt="Enlarged artwork">
  </div>

  <script>
    const lightbox = document.getElementById("lightbox");
    const zoomedImage = document.getElementById("zoomedImage");

    document.querySelectorAll(".gallery img").forEach(img => {
      img.addEventListener("click", () => {
        zoomedImage.src = img.src;
        zoomedImage.alt = img.alt;
        lightbox.classList.add("active");
      });
    });

    function closeImage() {
      lightbox.classList.remove("active");
      zoomedImage.src = "";
    }

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeImage();
    });
  </script>
</body>
</html>
