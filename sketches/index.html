
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sketches — starsandcats</title>
  <style>
    body {
      background: #f7f4f0;
      color: #222;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px 8%;
    }

    a { color: inherit; }

    h1 { margin-top: 50px; }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .gallery img {
      width: 100%;
      height: auto;
      display: block;
    }
</body>
</html>
