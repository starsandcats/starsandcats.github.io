
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sketches — starsandcats</title>
  <style>
    body {
      background: #f7f4f0;
      color: #222;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px 8%;
    }

    a { color: inherit; }

    h1 { margin-top: 50px; }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .gallery img {
      width: 100%;
      height: auto;
      display: block;
    }
    /* Make gallery artwork clickable */
.gallery img {
  cursor: zoom-in;
  transition: opacity 0.2s ease;
}

.gallery img:hover {
  opacity: 0.85;
}

/* Full-screen dark overlay */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0, 0, 0, 0.88);
  justify-content: center;
  align-items: center;
  padding: 50px 20px;
  box-sizing: border-box;
}

.lightbox.active {
  display: flex;
}

/* Enlarged artwork */
.lightbox img {
  max-width: 90vw;
  max-height: 85vh;
  width: auto;
  height: auto;
  object-fit: contain;
}

/* X close button */
.lightbox-close {
  position: absolute;
  top: 15px;
  right: 25px;
  color: white;
  font-size: 42px;
  background: none;
  border: none;
  cursor: pointer;
  line-height: 1;
}

.lightbox-close:hover {
  opacity: 0.7;
}
  </style>
</head>
<body>
  <a href="../index.html">← Back to home</a>

  <h1>Sketches</h1>
  <p>The Works in Progress.</p>

  <div class="gallery">
    <img src="../images/sketches/Figurestudies1.JPG"
         alt="Sketches: Figurestudies1.jpg">
   
  </div>
  
<script>
  function openImage(src) {
    document.getElementById("largeImage").src = src;
    document.getElementById("imageViewer").style.display = "flex";
    document.body.style.overflow = "hidden";
  }

  function closeImage() {
    document.getElementById("imageViewer").style.display = "none";
    document.body.style.overflow = "";
  }

  document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
      closeImage();
    }
  });
</script>

</body>
</html>
