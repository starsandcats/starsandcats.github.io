<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fishtank | starsandtigers</title>

<style>
  body {
  background: #000000;
  color: white;
  font-family: Arial, sans-serif;
  margin: 0;
}

header {
  background: #050505;
  padding: 28px 5%;
  border-bottom: 1px solid #777;
}

.brand {
  font-size: 16px;
  font-weight: bold;
}

nav {
  text-align: center;
}

nav a {
  color: white;
  text-decoration: none;
  margin: 0 12px;
}

nav a:hover {
  color: #ffdc00;
}

h1 {
  text-align: center;
  font-size: 42px;
  text-transform: uppercase;
  margin-top: 45px;
}

.description {
  text-align: center;
  margin: 15px auto 40px;
  max-width: 700px;
}

/* Artwork gallery */
.gallery {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
  max-width: 1100px;
  margin: 40px auto;
  padding: 0 20px;
}

.gallery img {
  width: 100%;
  height: auto;
  object-fit: contain;
  cursor: zoom-in;
  transition: transform 0.3s ease;
}

.gallery img:hover {
  transform: scale(1.03);
}

/* Enlarged artwork */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  z-index: 9999;
  justify-content: center;
  align-items: center;
  padding: 30px;
}

.lightbox.active {
  display: flex;
}

.lightbox img {
  max-width: 90%;
  max-height: 85vh;
  object-fit: contain;
}

.lightbox-close {
  position: absolute;
  top: 15px;
  right: 25px;
  color: white;
  background: none;
  border: none;
  font-size: 40px;
  cursor: pointer;
}

@media (max-width: 600px) {
  .gallery {
    grid-template-columns: 1fr;
  }
}
  </style> 
  </head>

<body>

<header>
  <div class="brand">starsandtigers</div>

  <nav>
    <a href="../../../">Home</a>
    <a href="../../../illustrations/">Illustrations</a>
    <a href="../../../animations/">Animations</a>
    <a href="../../../sketches/">Sketches</a>
    <a href="../../">Client Work</a>
  </nav>
</header>

<main>

  <h1>Fishtank</h1>

  <p class="description">
    Promotional artwork and creative work for Fishtank.
  </p>

  <section class="gallery">

    <img
      src="../../../images/clients/fishtank/fishtankseason1poster.jpg"
      alt="Fishtank Season 1 Poster">

  </section>

</main>

<!-- Image enlargement -->
<div class="lightbox" id="lightbox">

  <button class="lightbox-close" id="closeLightbox">
    &times;
  </button>

  <img id="lightboxImage" src="" alt="">

</div>

<script>
  const lightbox = document.getElementById('lightbox');
  const lightboxImage = document.getElementById('lightboxImage');

  document.querySelectorAll('.gallery img').forEach(img => {
    img.addEventListener('click', () => {
      lightboxImage.src = img.src;
      lightboxImage.alt = img.alt;
      lightbox.classList.add('active');
    });
  });

  document.getElementById('closeLightbox')
    .addEventListener('click', () => {
      lightbox.classList.remove('active');
      lightboxImage.src = '';
    });

  lightbox.addEventListener('click', event => {
    if (event.target === lightbox) {
      lightbox.classList.remove('active');
      lightboxImage.src = '';
    }
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      lightbox.classList.remove('active');
      lightboxImage.src = '';
    }
  });
</script>

</body>
</html>
