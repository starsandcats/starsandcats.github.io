
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Client Work | starsandtigers</title>

<style>

/* GENERAL */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #000000;
  color: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
}

/* TOP HEADER - FISHTANK STYLE */

header {
  width: 100%;
  background: #000000;
  border-bottom: 1px solid #777;
  padding: 24px 5%;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 30px;
}

.brand {
  color: #ffffff;
  font-size: 23px;
  font-weight: 900;
  white-space: nowrap;
  text-decoration: none;
}

/* NAVIGATION */

nav {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 24px;
}

nav a {
  color: #ffffff;
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
  white-space: nowrap;
  transition: color 0.2s ease;
}

nav a:hover {
  color: #ffdc00;
}

nav a.active {
  color: #f12518;
}

/* MAIN CONTENT */

main {
  width: 100%;
  padding: 55px 5% 35px;
}

/* CLIENT WORK HEADING + PROJECTS */

.client-layout {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 35px;
}

/* SIDE HEADING */

h1 {
  margin: 0;
  flex-shrink: 0;

  color: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
  font-size: clamp(30px, 3.5vw, 46px);
  font-weight: 900;
  text-transform: uppercase;
  white-space: nowrap;
  letter-spacing: -1px;
}

/* PROJECT GALLERY */

.projects {
  display: flex;
  align-items: flex-start;
  justify-content: flex-start;
  flex-wrap: nowrap;
  gap: 20px;
  min-width: 0;
}

/* PROJECT CARDS */

.project {
  display: block;
  width: 400px;
  flex: 0 0 400px;

  color: #ffffff;
  text-decoration: none;
  position: relative;
  z-index: 1;
  cursor: pointer;
}

/* PROJECT IMAGES */

.project img {
  display: block;
  width: 100%;
  height: auto;
  border: none;
  border-radius: 0;

  transition:
    transform 0.3s ease,
    filter 0.3s ease;

  transform-origin: center;
}

/* HOVER ENLARGEMENT */

.project:hover {
  z-index: 10;
}

.project:hover img {
  transform: scale(1.08);
  filter: brightness(1.08);
}

/* PROJECT TITLES */

.project-name {
  display: block;
  margin-top: 15px;

  font-size: 16px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #ffffff;

  transition: color 0.3s ease;
}

.project:hover .project-name {
  color: #ffdc00;
}

/* KEYBOARD ACCESSIBILITY */

.project:focus-visible {
  outline: 2px solid #ffdc00;
  outline-offset: 5px;
  z-index: 10;
}

.project:focus-visible img {
  transform: scale(1.08);
}

/* FOOTER */

footer {
  padding: 20px 5% 30px;
  color: #999;
  font-size: 12px;
}

/* RESPONSIVE LAYOUT */

/* MEDIUM DESKTOP */

@media (max-width: 1300px) {

  .client-layout {
    flex-direction: column;
    align-items: flex-start;
    gap: 30px;
  }

}

/* TABLET */

@media (max-width: 900px) {

  header {
    flex-direction: column;
    align-items: flex-start;
    gap: 18px;
  }

  nav {
    justify-content: flex-start;
    gap: 18px;
  }

  main {
    padding-top: 35px;
  }

  .projects {
    width: 100%;
  }

  .project {
    width: calc((100% - 20px) / 2);
    flex: 0 0 calc((100% - 20px) / 2);
  }

}

/* MOBILE */

@media (max-width: 600px) {

  header {
    padding: 20px 5%;
  }

  .brand {
    font-size: 20px;
  }

  nav {
    gap: 12px 16px;
  }

  nav a {
    font-size: 12px;
  }

  main {
    padding-top: 30px;
  }

  h1 {
    font-size: 32px;
  }

  .client-layout {
    gap: 25px;
  }

  .projects {
    gap: 12px;
  }

  .project {
    width: calc((100% - 12px) / 2);
    flex: 0 0 calc((100% - 12px) / 2);
  }

  .project-name {
    font-size: 12px;
    margin-top: 10px;
  }

}

/* REDUCED MOTION */

@media (prefers-reduced-motion: reduce) {

  .project img,
  .project-name,
  nav a {
    transition: none;
  }

}

</style>
</head>

<body>

<!-- TOP NAVIGATION HEADER -->

<header>

  <a class="brand" href="/">
    ★ starsandtigers ★
  </a>

  <nav aria-label="Main navigation">

    <a href="/">
      Home
    </a>

    <a href="/illustration/">
      Illustrations
    </a>

    <a href="/animations/">
      Animations
    </a>

    <a href="/sketches/">
      Sketches
    </a>

    <a href="/client-projects/" class="active" aria-current="page">
      Client Work
    </a>

  </nav>

</header>

<!-- MAIN CONTENT -->

<main>

  <div class="client-layout">

    <!-- HEADING ON LEFT -->

    <h1>CLIENT WORK</h1>

    <!-- PROJECT THUMBNAILS -->

    <div class="projects">

      <!-- FISHTANK -->

      <a
        class="project"
        href="/client-projects/clients/fishtank/">

        <img
          src="/images/clients/fishtank/fishtankthumbnail.jpg"
          alt="Fishtank Season 1 artwork">

        <span class="project-name">
          Fishtank
        </span>

      </a>

      <!-- DBS -->

      <a
        class="project"
        href="/client-projects/clients/dbs/">

        <img
          src="/images/clients/dbs/dbsthumbnail.jpg"
          alt="Down Bad Society artwork">

        <span class="project-name">
          DBS
        </span>

      </a>

    </div>

  </div>

</main>

<!-- FOOTER -->

<footer>
  © 2026 starsandtigers
</footer>

</body>
</html>
