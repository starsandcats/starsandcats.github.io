
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Client Work | starsandtigers</title>

<style>

/* GENERAL */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #000000;
  color: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
}

/* HEADER */

header {
  background: #050505;
  padding: 28px 5%;
  border-bottom: 1px solid #777;
}

.brand {
  font-size: 16px;
  font-weight: bold;
  color: white;
}

nav {
  text-align: center;
  margin-top: 22px;
}

nav a {
  color: white;
  text-decoration: none;
  margin: 0 10px;
  font-size: 13px;
}

nav a:hover,
nav a.active {
  color: #ffdc00;
}

/* MAIN CONTENT */

main {
  width: 100%;
  padding: 35px 5% 20px;
}

/* HEADING AND THUMBNAILS */

.client-layout {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 35px;
  width: 100%;
}

h1 {
  font-weight: 900;
  font-size: clamp(30px, 4vw, 46px);
  text-transform: uppercase;
  text-align: left;
  margin: 0;
  white-space: nowrap;
  flex-shrink: 0;
}

/* PROJECT GALLERY */

.projects {
  --thumbnail-width: 400px;
  --gallery-gap: 20px;

  display: flex;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: flex-start;
  gap: var(--gallery-gap);

  width: fit-content;
  max-width: 100%;
  margin: 0;
  padding: 0;
}

/* INDIVIDUAL PROJECT */

.project {
  display: block;
  width: var(--thumbnail-width);
  flex: 0 0 var(--thumbnail-width);
  color: white;
  text-decoration: none;
  cursor: pointer;
  position: relative;
  z-index: 1;
}

/* THUMBNAILS */

.project img {
  display: block;
  width: 100%;
  height: auto;
  border: none;
  border-radius: 0;

  transition:
    transform 0.25s ease,
    filter 0.25s ease;

  transform-origin: center center;
}

/* HOVER ENLARGEMENT */

.project:hover {
  z-index: 5;
}

.project:hover img {
  transform: scale(1.08);
  filter: brightness(1.08);
}

/* KEYBOARD FOCUS */

.project:focus-visible {
  outline: 2px solid #ffdc00;
  outline-offset: 5px;
  z-index: 5;
}

.project:focus-visible img {
  transform: scale(1.08);
}

/* PROJECT NAMES */

.project-name {
  display: block;
  margin-top: 12px;
  font-size: 15px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 1px;
  text-align: left;
  color: white;
  transition: color 0.25s ease;
}

.project:hover .project-name {
  color: #ffdc00;
}

/* FOOTER */

footer {
  text-align: left;
  padding: 15px 5% 25px;
  color: #aaa;
  font-size: 12px;
}

/* RESPONSIVE LAYOUT */

@media (max-width: 1300px) {

  .client-layout {
    flex-direction: column;
    align-items: flex-start;
    gap: 25px;
  }

  .projects {
    flex-wrap: wrap;
  }

}

@media (max-width: 900px) {

  .projects {
    --thumbnail-width: min(400px, calc((90vw - 20px) / 2));
    flex-wrap: nowrap;
  }

}

@media (max-width: 650px) {

  header {
    padding: 20px 5%;
  }

  nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
  }

  nav a {
    margin: 0;
  }

  main {
    padding-top: 25px;
  }

  h1 {
    font-size: 30px;
  }

  .client-layout {
    gap: 20px;
  }

  .project-name {
    font-size: 12px;
  }

}

/* REDUCED MOTION */

@media (prefers-reduced-motion: reduce) {

  .project img,
  .project-name {
    transition: none;
  }

}

</style>
</head>

<body>

<!-- HEADER -->

<header>

  <div class="brand">
    starsandtigers
  </div>

  <nav>
    <a href="/">Home</a>

    <a href="/illustration/">
      Digital Illustrations
    </a>

    <a href="/animations/">
      Animations
    </a>

    <a href="/client-projects/" class="active">
      Client Projects
    </a>

    <a href="/sketches/">
      Sketches
    </a>
  </nav>

</header>

<!-- MAIN CONTENT -->

<main>

  <div class="client-layout">

    <!-- HEADING ON LEFT -->

    <h1>CLIENT WORK</h1>

    <!-- PROJECT THUMBNAILS -->

    <div class="projects">

      <!-- FISHTANK -->

      <a
        class="project"
        href="/client-projects/clients/fishtank/">

        <img
          src="/images/clients/fishtank/fishtankthumbnail.jpg"
          alt="Fishtank Season 1 artwork"
          decoding="async">

        <span class="project-name">
          Fishtank
        </span>

      </a>

      <!-- DBS -->

      <a
        class="project"
        href="/client-projects/clients/dbs/">

        <img
          src="/images/clients/dbs/dbsthumbnail.jpg"
          alt="Down Bad Society artwork"
          decoding="async">

        <span class="project-name">
          DBS
        </span>

      </a>

    </div>

  </div>

</main>

<!-- FOOTER -->

<footer>
  © 2026 starsandtigers
</footer>

</body>
</html>
