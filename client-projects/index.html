
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Client Work | starsandtigers</title>

<style>

/* GENERAL */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #000000;
  color: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
}

/* HEADER */

header {
  background: #050505;
  padding: 28px 5%;
  border-bottom: 1px solid #777;
}

.brand {
  font-family: Arial, sans-serif;
  font-size: 16px;
  font-weight: bold;
  color: white;
}

nav {
  text-align: center;
  margin-top: 22px;
}

nav a {
  color: white;
  text-decoration: none;
  margin: 0 10px;
  font-size: 13px;
}

nav a:hover {
  color: #ffdc00;
}

nav a.active {
  color: #ffdc00;
}

/* MAIN CONTENT */

main {
  width: 100%;
  padding: 30px 5% 20px;
}

/* TITLE */

h1 {
  font-family: Arial, sans-serif;
  font-weight: bold;
  font-size: clamp(30px, 4vw, 46px);
  text-transform: uppercase;
  text-align: left;
  margin: 0 0 25px;
  letter-spacing: 1px;
}

/* PROJECT GALLERY */

/*
  Both thumbnails stay grouped together
  on the left side of the page.

  Adjust --thumbnail-width and --gallery-gap
  to control their size and spacing.
*/

.projects {
  --thumbnail-width: 240px;
  --gallery-gap: 12px;

  display: flex;
  flex-wrap: wrap;
  justify-content: flex-start;
  align-items: flex-start;
  gap: var(--gallery-gap);

  width: fit-content;
  max-width: 100%;
  margin: 0;
  padding: 0;
}

/* INDIVIDUAL PROJECT */

.project {
  display: block;
  width: var(--thumbnail-width);
  max-width: 100%;
  flex: 0 0 auto;

  color: white;
  text-decoration: none;
  cursor: pointer;

  position: relative;
  z-index: 1;
}

/* THUMBNAILS */

.project img {
  display: block;
  width: 100%;
  height: auto;

  border: none;
  border-radius: 0;

  transition:
    transform 0.25s ease,
    filter 0.25s ease;

  transform-origin: center center;
}

/* HOVER ENLARGEMENT */

.project:hover {
  z-index: 5;
}

.project:hover img {
  transform: scale(1.08);
  filter: brightness(1.08);
}

/* KEYBOARD FOCUS */

.project:focus-visible {
  outline: 2px solid #ffdc00;
  outline-offset: 5px;
  z-index: 5;
}

.project:focus-visible img {
  transform: scale(1.08);
}

/* PROJECT NAMES */

.project-name {
  display: block;
  margin-top: 12px;

  font-size: 15px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 1px;

  text-align: left;
  color: white;

  transition: color 0.25s ease;
}

.project:hover .project-name {
  color: #ffdc00;
}

/* FOOTER */

footer {
  text-align: left;
  padding: 15px 5% 25px;
  color: #aaa;
  font-size: 12px;
}

/* SMALLER SCREENS */

@media (max-width: 650px) {

  header {
    padding: 20px 5%;
  }

  nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
  }

  nav a {
    margin: 0;
  }

  main {
    padding-top: 25px;
  }

  h1 {
    font-size: 30px;
    margin-bottom: 20px;
  }

  .projects {
    --thumbnail-width: calc((90vw - 12px) / 2);
    --gallery-gap: 12px;
  }

  .project-name {
    font-size: 12px;
  }

}

/* REDUCED MOTION */

@media (prefers-reduced-motion: reduce) {

  .project img,
  .project-name {
    transition: none;
  }

}

</style>
</head>

<body>

<!-- HEADER -->

<header>

  <div class="brand">
    starsandtigers
  </div>

  <nav>
    <a href="/">Home</a>

    <a href="/illustration/">
      Digital Illustrations
    </a>

    <a href="/animations/">
      Animations
    </a>

    <a href="/client-projects/" class="active">
      Client Projects
    </a>

    <a href="/sketches/">
      Sketches
    </a>
  </nav>

</header>

<!-- MAIN CONTENT -->

<main>

  <h1>Client Work</h1>

  <div class="projects">

    <!-- FISHTANK -->

    <a class="project"
       href="/client-projects/clients/fishtank/">

      <img
        src="/images/clients/fishtank/fishtankthumbnail.jpg"
        alt="Fishtank Season 1 artwork"
        decoding="async">

      <span class="project-name">
        Fishtank
      </span>

    </a>

    <!-- DBS -->

    <a class="project"
       href="/client-projects/clients/dbs/">

      <img
        src="/images/clients/dbs/dbsthumbnail.jpg"
        alt="Down Bad Society artwork"
        decoding="async">

      <span class="project-name">
        DBS
      </span>

    </a>

  </div>

</main>

<!-- FOOTER -->

<footer>
  © 2026 starsandtigers
</footer>

</body>
</html>
