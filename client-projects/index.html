
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client Projects — Stars and Cats</title>
  <style>
    * { box-sizing: border-box; }

    body {
  margin: 0;
  background: #181818;
  color: white;
  font-family: Arial, sans-serif;
  font-weight: normal;
    }

    header {
      background: #050505;
      padding: 28px 5%;
      border-bottom: 1px solid #777;
    }

    .brand {
      .brand {
  font-family: Arial, sans-serif;
  font-size: 16px;
  font-weight: bold;
}
    }

    nav {
      text-align: center;
      margin-top: 22px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
      font-size: 13px;
    }

    nav a:hover { color: #ffdc00; }

    h1 {
      text-align: center;
  font-family: Arial, sans-serif;
  font-weight: normal;
  font-size: clamp(34px, 5vw, 64px);
  margin: 45px 10px 30px;
  text-transform: uppercase;
    }

    .projects {
      width: min(850px, 90%);
      margin: 0 auto 70px;
      display: grid;
      gap: 65px;
    }

    .project img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform .25s ease;
    }

    .project:hover img {
      transform: scale(1.025);
    }

    .project {
      display: block;
      overflow: hidden;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #aaa;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">starsandtigers</div>
  <nav>
    <a href="../">Home</a>
    <a href="../illustrations/">Digital Illustrations</a>
    <a href="../animations/">Animations</a>
    <a href="./">Client Projects</a>
    <a href="../sketches/">Sketches</a>
  </nav>
</header>

<h1>Client Projects</h1>

<main class="projects">
  <a class="project" href="../clients/fishtank/">
    <img src="../images/clients/fishtank/fishtankthumbnail.jpg"
         alt="Season 1 Fishtank client project">
  </a>

  <a class="project" href="../clients/dbs/">
    <img src="../images/clients/dbs/dbsthumbnail.jpg"
         alt="DBS client project">
  </a>
</main>

<footer>© 2026 Stars and Cats</footer>

</body>
</html>
