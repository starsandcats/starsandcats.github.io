
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Illustrations — Stars and Cats</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000000;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      background: #050505;
      padding: 28px 5%;
      border-bottom: 1px solid #777;
    }

    .brand {
      font-size: 16px;
      font-weight: bold;
    }

    nav {
      text-align: center;
      margin-top: 22px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
      font-size: 13px;
    }

    nav a:hover {
      color: #ffdc00;
    }

    h1 {
      text-align: center;
      font-size: clamp(34px, 5vw, 64px);
      font-weight: normal;
      margin: 45px 10px 30px;
      text-transform: uppercase;
    }

    main {
      padding: 0 8% 40px;
    }

    .description {
      text-align: center;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .gallery img {
      width: 100%;
      height: auto;
      display: block;
      cursor: zoom-in;
      transition: opacity 0.2s ease;
      transition: transform 0.3s ease;
    }

    .gallery img:hover {
    transform: scale(1.15);
    z-index: 10;
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.88);
      justify-content: center;
      align-items: center;
      padding: 50px 20px;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 15px;
      right: 25px;
      color: white;
      font-size: 42px;
      background: none;
      border: none;
      cursor: pointer;
      line-height: 1;
    }

    .lightbox-close:hover {
      opacity: 0.7;
    }
  </style>
</head>

<body>

<header>
  <div class="brand">starsandtigers</div>
  <nav>
    <a href="../">Home</a>
    <a href="../illustrations/">Illustrations</a>
    <a href="../animations/">Animations</a>
    <a href="../client-projects/">Client Projects</a>
    <a href="../sketches/">Sketches</a>
  </nav>
</header>

<h1>Illustrations</h1>

<main>
  <p class="description">★The Illustrated Works★</p>

  <div class="gallery">
    <img src="../images/illustration/butchers.jpg" alt="Butchers">
    <img src="../images/illustration/petersteele.jpg" alt="Portrait of Peter Steele">
    <img src="../images/illustration/paulo.jpg" alt="Portrait of Paulo">
    <img src="../images/illustration/ripped.jpg" alt="Illustration: Ripped">
  </div>
</main>

<div class="lightbox" id="lightbox" role="dialog"
     aria-modal="true" aria-label="Enlarged artwork">

  <button class="lightbox-close" id="lightboxClose"
          aria-label="Close enlarged image">&times;</button>

  <img id="lightboxImage" src="" alt="">
</div>

<script>
  const lightbox = document.getElementById('lightbox');
  const lightboxImage = document.getElementById('lightboxImage');
  const closeButton = document.getElementById('lightboxClose');

  document.querySelectorAll('.gallery img').forEach(img => {
    img.addEventListener('click', () => {
      lightboxImage.src = img.src;
      lightboxImage.alt = img.alt;
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
      closeButton.focus();
    });
  });

  function closeLightbox() {
    lightbox.classList.remove('active');
    lightboxImage.src = '';
    document.body.style.overflow = '';
  }

  closeButton.addEventListener('click', closeLightbox);

  lightbox.addEventListener('click', event => {
    if (event.target === lightbox) {
      closeLightbox();
    }
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && lightbox.classList.contains('active')) {
      closeLightbox();
    }
  });
</script>

</body>
</html>
