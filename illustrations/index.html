
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Illustrations | starsandtigers</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

/* HEADER */

header {
  width: 100%;
  padding: 24px 5%;
  background: #000;
  border-bottom: 1px solid #777;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 30px;
}

.brand {
  color: white;
  text-decoration: none;
  font-size: 23px;
  font-weight: 900;
  white-space: nowrap;
}

nav {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 24px;
}

nav a {
  color: white;
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
  transition: color .25s ease;
}

nav a:hover,
nav a.active {
  color: #ffdc00;
}

/* MAIN CONTENT */

main {
  padding: 45px 5% 80px;
}

h1 {
  font-size: clamp(36px, 5vw, 60px);
  font-weight: 900;
  text-transform: uppercase;
  margin: 0 0 15px;
}

.description {
  color: #ccc;
  font-size: 15px;
  margin: 0 0 35px;
}

/* ILLUSTRATION GALLERY */

.gallery {
  display: grid;
  grid-template-columns:
    repeat(3, minmax(0, 1fr));
  gap: 20px;
  align-items: start;
}

.artwork {
  position: relative;
  min-width: 0;
  z-index: 1;
}

.artwork:hover {
  z-index: 10;
}

.artwork img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 0;
  cursor: zoom-in;
  transition:
    transform .3s ease,
    filter .3s ease;
}

.artwork img:hover {
  transform: scale(1.08);
  filter: brightness(1.08);
}

/* LIGHTBOX */

.lightbox {
  position: fixed;
  inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,.96);
  z-index: 9999;
  padding: 55px;
}

.lightbox.active {
  display: flex;
}

.lightbox img {
  max-width: 90vw;
  max-height: 85vh;
  object-fit: contain;
}

.close,
.arrow {
  position: absolute;
  color: white;
  border: none;
  background: transparent;
  cursor: pointer;
}

.close {
  top: 15px;
  right: 25px;
  font-size: 42px;
}

.arrow {
  top: 50%;
  transform: translateY(-50%);
  font-size: 40px;
}

.prev {
  left: 15px;
}

.next {
  right: 15px;
}

.close:hover,
.arrow:hover {
  color: #ffdc00;
}

/* RESPONSIVE */

@media (max-width: 900px) {
  header {
    flex-direction: column;
    align-items: flex-start;
    gap: 18px;
  }

  nav {
    justify-content: flex-start;
    gap: 18px;
  }

  .gallery {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 600px) {
  header {
    padding: 20px 5%;
  }

  .brand {
    font-size: 20px;
  }

  nav {
    gap: 12px 16px;
  }

  nav a {
    font-size: 12px;
  }

  main {
    padding-top: 30px;
  }

  .gallery {
    grid-template-columns: 1fr;
    gap: 18px;
  }

  .lightbox {
    padding: 50px 35px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .artwork img,
  nav a {
    transition: none;
  }
}
</style>
</head>

<body>

<!-- HEADER -->

<header>
  <a class="brand" href="/">
    ★ starsandtigers ★
  </a>

  <nav aria-label="Main navigation">
    <a href="/">Home</a>

    <a href="/illustration/"
       class="active"
       aria-current="page">
      Illustrations
    </a>

    <a href="/animations/">
      Animations
    </a>

    <a href="/sketches/">
      Sketches
    </a>

    <a href="/client-projects/">
      Client Work
    </a>
  </nav>
</header>

<!-- MAIN -->

<main>

  <h1>ILLUSTRATIONS</h1>

  <p class="description">
    A collection of my illustrative works.
  </p>

  <div class="gallery" id="gallery"></div>

</main>

<!-- LIGHTBOX -->

<div class="lightbox" id="lightbox">

  <button class="close"
          id="close"
          aria-label="Close image">
    &times;
  </button>

  <button class="arrow prev"
          id="prev"
          aria-label="Previous image">
    &#10094;
  </button>

  <img id="lightboxImage"
       src=""
       alt="Enlarged illustration">

  <button class="arrow next"
          id="next"
          aria-label="Next image">
    &#10095;
  </button>

</div>

<script>

/* GALLERY */

const gallery = document.getElementById("gallery");

const folder = "/images/illustration/";

const githubAPI =
  "https://api.github.com/repos/" +
  "starsandcats/starsandcats.github.io/" +
  "contents/images/illustration?ref=main";

const fallbackFiles = [
  "ripped.jpg",
  "petersteele.jpg"
];

let images = [];
let currentIndex = 0;

function renderGallery(files) {
  gallery.innerHTML = "";
  images = [];

  files.forEach(filename => {
    const src = folder +
      filename.split("/").map(encodeURIComponent).join("/");

    const item = document.createElement("div");
    item.className = "artwork";

    const img = document.createElement("img");
    img.src = src;
    img.alt = filename.replace(/\.[^.]+$/, "");
    img.loading = "lazy";

    const index = images.length;
    images.push(src);

    img.addEventListener("click", () => {
      openLightbox(index);
    });

    item.appendChild(img);
    gallery.appendChild(item);
  });
}

async function loadGallery() {
  try {
    const response = await fetch(githubAPI);

    if (!response.ok) {
      throw new Error("Could not load image list");
    }

    const files = await response.json();

    const imageFiles = files
      .filter(file =>
        file.type === "file" &&
        /\.(jpg|jpeg|png|gif|webp)$/i.test(file.name)
      )
      .map(file => file.name)
      .sort((a, b) =>
        a.localeCompare(b, undefined, {
          numeric: true
        })
      );

    if (imageFiles.length === 0) {
      throw new Error("No images found");
    }

    renderGallery(imageFiles);

  } catch (error) {
    renderGallery(fallbackFiles);
  }
}

loadGallery();

/* LIGHTBOX */

const lightbox =
  document.getElementById("lightbox");

const lightboxImage =
  document.getElementById("lightboxImage");

function openLightbox(index) {
  currentIndex = index;

  lightboxImage.src = images[index];

  lightbox.classList.add("active");
  document.body.style.overflow = "hidden";
}

function closeLightbox() {
  lightbox.classList.remove("active");
  document.body.style.overflow = "";
}

function changeImage(direction) {
  if (!images.length) return;

  currentIndex =
    (currentIndex + direction + images.length) %
    images.length;

  lightboxImage.src = images[currentIndex];
}

document.getElementById("close")
  .addEventListener("click", closeLightbox);

document.getElementById("prev")
  .addEventListener("click", () => changeImage(-1));

document.getElementById("next")
  .addEventListener("click", () => changeImage(1));

lightbox.addEventListener("click", event => {
  if (event.target === lightbox) {
    closeLightbox();
  }
});

document.addEventListener("keydown", event => {
  if (!lightbox.classList.contains("active")) return;

  if (event.key === "Escape") {
    closeLightbox();
  }

  if (event.key === "ArrowLeft") {
    changeImage(-1);
  }

  if (event.key === "ArrowRight") {
    changeImage(1);
  }
});

</script>

</body>
</html>
