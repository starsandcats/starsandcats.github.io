<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>starsandtigers — Art Portfolio</title>
  <style>
    body {
      margin: 0;
      background: #f7f5f0;
      color: #222;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 32px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
    }
    nav a {
      margin-left: 18px;
      color: inherit;
      text-decoration: none;
    }
    main { padding: 55px 6%; }
    h1 { font-size: clamp(36px, 7vw, 72px); }
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }
    .gallery img {
      width: 100%;
      display: block;
      object-fit: cover;
    }
    .about { margin-top: 70px; max-width: 600px; }
    footer { padding: 30px 6%; }
    @media (max-width: 600px) {
      .gallery { grid-template-columns: 1fr; }
      header { padding: 22px 5%; }
      nav a { margin-left: 8px; }
      main { padding: 30px 5%; }
    }
  </style>
</head>
<body>
  <header>
    <strong>starsandtigers</strong>
    <p>Illustration · Animation · Visual Art</p>
    <nav>
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <h1>★Best of ★</h1>
    <p>Illustration · Animation · Visual Art</p>

    <section id="work" class="gallery">
      <img src="images/illustration/butchers.jpg" alt="Butchers artwork">
      <img src="images/illustration/paulo.jpg" alt="Paulo artwork">
      <img src="images/illustration/dbs.jpg" alt="Dbs artwork">
      <img src="images/illustration/ripped.jpg" alt="Ripped artwork">
    </section>

    <section id="about" class="about">
      <h2>About</h2>
      <p>
        I draw.
      </p>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>Instagram: @starsandtigers</p>
    </section>
  </main>

  <footer>© 2026 starsandtigers</footer>
</body>
</html>
