 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animations — starsandcats</title>
  <style>
    body {
      background: #f7f4f0;
      color: #222;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px 8%;
    }

    a { color: inherit; }

    h1 { margin-top: 50px; }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .gallery img {
      width: 100%;
      height: auto;
      display: block;
    }
    
/* Make gallery artwork clickable */
.gallery img {
  cursor: zoom-in;
  transition: opacity 0.2s ease;
}

.gallery img:hover {
  opacity: 0.85;
}

/* Full-screen dark overlay */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0, 0, 0, 0.88);
  justify-content: center;
  align-items: center;
  padding: 50px 20px;
  box-sizing: border-box;
}

.lightbox.active {
  display: flex;
}

/* Enlarged artwork */
.lightbox img {
  max-width: 90vw;
  max-height: 85vh;
  width: auto;
  height: auto;
  object-fit: contain;
}

/* X close button */
.lightbox-close {
  position: absolute;
  top: 15px;
  right: 25px;
  color: white;
  font-size: 42px;
  background: none;
  border: none;
  cursor: pointer;
  line-height: 1;
}

.lightbox-close:hover {
  opacity: 0.7;
}
  </style>
</head>
<body>
  <a href="../index.html">← Back to home</a>

  <h1>Animations</h1>
  <p>The Animated Works.</p>

  <div class="gallery">
      <img src="../images/animation/DBS_gun_Animation_Final.gif"
         alt="DBS_gun_Animation_Final.gif">
   
         <img src="../images/animation/DBS_lifting_Animation.gif"
         alt="DBS_lifting_Animation.gif">
  </div>
  
<div class="lightbox" id="lightbox" role="dialog"
     aria-modal="true" aria-label="Enlarged artwork">
  <button class="lightbox-close" id="lightboxClose"
          aria-label="Close enlarged image">&times;</button>
  <img id="lightboxImage" src="" alt="">
</div>

<script>
  const lightbox = document.getElementById('lightbox');
  const lightboxImage = document.getElementById('lightboxImage');
  const closeButton = document.getElementById('lightboxClose');

  document.querySelectorAll('.gallery img').forEach(img => {
    img.addEventListener('click', () => {
      lightboxImage.src = img.src;
      lightboxImage.alt = img.alt;
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
      closeButton.focus();
    });
  });

  function closeLightbox() {
    lightbox.classList.remove('active');
    lightboxImage.src = '';
    document.body.style.overflow = '';
  }

  closeButton.addEventListener('click', closeLightbox);

  lightbox.addEventListener('click', event => {
    if (event.target === lightbox) {
      closeLightbox();
    }
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && lightbox.classList.contains('active')) {
      closeLightbox();
    }
  });
</script>
</body>
</html>
