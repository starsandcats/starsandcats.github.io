
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Animations | starsandtigers</title>

<style>

/* GENERAL */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #000000;
  color: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
}

/* HEADER */

header {
  width: 100%;
  background: #000000;
  border-bottom: 1px solid #777;
  padding: 24px 5%;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 30px;
}

/* BRAND */

.brand {
  color: #ffffff;
  font-size: 23px;
  font-weight: 900;
  white-space: nowrap;
  text-decoration: none;
}

/* NAVIGATION */

nav {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 24px;
}

nav a {
  color: #ffffff;
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
  white-space: nowrap;
  transition: color 0.2s ease;
}

nav a:hover,
nav a.active {
  color: #ffdc00;
}

/* MAIN CONTENT */

main {
  width: 100%;
  padding: 45px 5% 60px;
}

/* PAGE TITLE */

h1 {
  margin: 0 0 15px;
  color: #ffffff;
  font-size: clamp(36px, 5vw, 60px);
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: -1px;
}

/* DESCRIPTION */

.description {
  color: #bcbcbc;
  font-size: 15px;
  line-height: 1.7;
  margin: 0 0 35px;
}

/* ANIMATION GALLERY */

.gallery {
  display: grid;
  grid-template-columns: repeat(
    auto-fit,
    minmax(220px, 1fr)
  );
  gap: 20px;
  width: 100%;
}

/* GIFS */

.gallery img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 0;
  cursor: zoom-in;

  transition:
    transform 0.3s ease,
    opacity 0.3s ease;
}

.gallery img:hover {
  transform: scale(1.03);
  opacity: 0.85;
}

/* LIGHTBOX */

.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0, 0, 0, 0.95);
  justify-content: center;
  align-items: center;
  padding: 50px 20px;
}

.lightbox.active {
  display: flex;
}

/* ENLARGED GIF */

.lightbox img {
  max-width: 90vw;
  max-height: 85vh;
  width: auto;
  height: auto;
  object-fit: contain;
}

/* CLOSE BUTTON */

.lightbox-close {
  position: absolute;
  top: 15px;
  right: 25px;
  color: #ffffff;
  font-size: 42px;
  background: none;
  border: none;
  cursor: pointer;
  line-height: 1;
}

.lightbox-close:hover {
  color: #ffdc00;
}

/* FOOTER */

footer {
  padding: 20px 5% 30px;
  color: #999;
  font-size: 12px;
}

/* TABLET */

@media (max-width: 900px) {

  header {
    flex-direction: column;
    align-items: flex-start;
    gap: 18px;
  }

  nav {
    justify-content: flex-start;
    gap: 18px;
  }

}

/* MOBILE */

@media (max-width: 600px) {

  header {
    padding: 20px 5%;
  }

  .brand {
    font-size: 20px;
  }

  nav {
    gap: 12px 16px;
  }

  nav a {
    font-size: 12px;
  }

  main {
    padding-top: 30px;
  }

  h1 {
    font-size: 36px;
  }

  .gallery {
    grid-template-columns: repeat(
      auto-fit,
      minmax(150px, 1fr)
    );
    gap: 12px;
  }

}

/* REDUCED MOTION */

@media (prefers-reduced-motion: reduce) {

  nav a,
  .gallery img {
    transition: none;
  }

}

</style>
</head>

<body>

<!-- TOP HEADER -->

<header>

  <a class="brand" href="/">
    ★ starsandtigers ★
  </a>

  <nav aria-label="Main navigation">

    <a href="/">
      Home
    </a>

    <a href="/illustrations/">
      Illustrations
    </a>

    <a href="/animations/"
       class="active"
       aria-current="page">
      Animations
    </a>

    <a href="/sketches/">
      Sketches
    </a>

    <a href="/client-projects/">
      Client Work
    </a>

  </nav>

</header>

<!-- MAIN CONTENT -->

<main>

  <h1>ANIMATIONS</h1>

  <p class="description">
    The Animated Works.
  </p>

  <!-- ANIMATION GALLERY -->

  <div class="gallery">

    <img
      src="/images/animation/DBS_gun_Animation_Final.gif"
      alt="DBS gun animation">

    <img
      src="/images/animation/DBS_lifting_Animation_.GIF"
      alt="DBS lifting animation">

  </div>

</main>

<!-- LIGHTBOX -->

<div
  class="lightbox"
  id="lightbox"
  role="dialog"
  aria-modal="true"
  aria-label="Enlarged animation">

  <button
    class="lightbox-close"
    id="lightboxClose"
    aria-label="Close enlarged animation">
    &times;
  </button>

  <img
    id="lightboxImage"
    src=""
    alt="">

</div>

<!-- FOOTER -->

<footer>
  © 2026 starsandtigers
</footer>

<!-- JAVASCRIPT -->

<script>

const lightbox =
  document.getElementById("lightbox");

const lightboxImage =
  document.getElementById("lightboxImage");

const closeButton =
  document.getElementById("lightboxClose");

/* OPEN ANIMATION */

document.querySelectorAll(".gallery img")
  .forEach(img => {

    img.addEventListener("click", () => {

      lightboxImage.src = img.src;
      lightboxImage.alt = img.alt;

      lightbox.classList.add("active");

      document.body.style.overflow = "hidden";

      closeButton.focus();

    });

  });

/* CLOSE ANIMATION */

function closeLightbox() {

  lightbox.classList.remove("active");

  lightboxImage.src = "";

  document.body.style.overflow = "";

}

/* CLOSE BUTTON */

closeButton.addEventListener(
  "click",
  closeLightbox
);

/* CLICK OUTSIDE */

lightbox.addEventListener("click", event => {

  if (event.target === lightbox) {
    closeLightbox();
  }

});

/* ESCAPE KEY */

document.addEventListener("keydown", event => {

  if (
    event.key === "Escape" &&
    lightbox.classList.contains("active")
  ) {
    closeLightbox();
  }

});

</script>

</body>
</html>
